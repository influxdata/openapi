  description: |
    A measure group: one or more numeric values that share a unit.
    Durations are float seconds with `unit: seconds`.
  type: object
  required:
    - unit
  properties:
    unit:
      type: string
      example: shards
  additionalProperties:
    type: number
  example:
    completed: 94
    total: 200
    unit: shards
