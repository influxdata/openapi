  type: object
  properties:
    status:
      type: string
      enum:
        - ready
        - starting
    started:
      type: string
      format: date-time
      example: "2019-03-13T10:09:33.891196-04:00"
    up:
      type: string
      example: "14m45.911966424s"
    uptime:
      description: Time since `started`, in float seconds.
      allOf:
        - $ref: "./HealthCheckMeasure.yml"
    checks:
      description: |
        Ready gates that haven't passed.
        Omitted when `status` is `ready`.
      type: array
      items:
        $ref: "./HealthCheck.yml"
