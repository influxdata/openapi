  description: |
    A health check.
    A check can also report measure groups, such as `progress` or `failures`.
    Each key other than `name`, `status`, `message`, and `checks` whose value
    is an object is a measure group.
  type: object
  required:
    - name
    - status
  properties:
    name:
      type: string
    message:
      type: string
      description: |
        Status detail. For a failing check, may contain the raw error text.
    checks:
      type: array
      items:
        $ref: "./HealthCheck.yml"
    status:
      $ref: "./HealthCheckStatus.yml"
    version:
      type: string
      description: Build version. Returned only at the top level.
    commit:
      type: string
      description: Build commit. Returned only at the top level.
  additionalProperties:
    $ref: "./HealthCheckMeasure.yml"
